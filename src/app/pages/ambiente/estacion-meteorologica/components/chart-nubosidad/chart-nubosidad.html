<article class="chart-card">

  <div class="chart-header">

    <div>
      <span>Condiciones del cielo</span>

      <h4>Nubosidad</h4>
    </div>

  </div>

  @if (serie.length > 0) {

    <div class="chart-container">

      <canvas
        baseChart
        [type]="chartType"
        [data]="chartData"
        [options]="chartOptions"
      >
      </canvas>

    </div>

  } @else {

    <div class="chart-placeholder">

      <svg lucideCloud></svg>

      <p>
        Todavía no hay registros de nubosidad
        para el rango seleccionado.
      </p>

    </div>

  }

</article>
