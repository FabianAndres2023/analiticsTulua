<article class="chart-card">

  <div class="chart-header">

    <div>
      <span>Análisis de precipitación</span>

      <h4>Precipitación acumulada</h4>

      <p>
        Evolución de la lluvia acumulada durante
        el período seleccionado.
      </p>
    </div>

    @if (datos.length > 0) {

      <div class="total-indicator">

        <span>Total</span>

        <strong>
          {{ totalAcumulado.toFixed(2) }} mm
        </strong>

      </div>

    }

  </div>

  @if (datos.length > 0) {

    <div class="chart-container">

      <canvas
        baseChart
        [type]="chartType"
        [data]="chartData"
        [options]="chartOptions"
      >
      </canvas>

    </div>

  } @else {

    <div class="chart-placeholder">

      <p>
        Todavía no hay registros de precipitación
        para el rango seleccionado.
      </p>

    </div>

  }

</article>
