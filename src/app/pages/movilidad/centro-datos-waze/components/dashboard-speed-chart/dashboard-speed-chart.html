<article class="chart-card">

  <div class="chart-header">
    <div>
      <span>Tendencia de velocidades</span>
      <h4>Velocidad promedio registrada</h4>
    </div>
  </div>

  @if (hasSpeedData) {

    <div class="chart-container">
      <canvas
        baseChart
        [type]="chartType"
        [data]="chartData"
        [options]="chartOptions"
      >
      </canvas>
    </div>

  } @else {

    <div class="chart-placeholder">

      <svg lucideGauge></svg>

      <strong>
        Sin atascos activos
      </strong>

      <p>
        Waze todavía no ha reportado valores de velocidad
        en los registros históricos disponibles.
      </p>

    </div>

  }

</article>
