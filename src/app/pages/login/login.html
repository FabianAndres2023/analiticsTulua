<section class="login-page">

  <div class="login-card">


    <!-- ===================================================
         LOGO
         =================================================== -->

    <img
      src="/logo.png"
      alt="Analytics Tuluá"
      class="logo"
    />


    <!-- ===================================================
         ENCABEZADO
         =================================================== -->

    <h2>
      Iniciar sesión
    </h2>


    <p class="subtitle">
      Plataforma de Inteligencia Territorial
    </p>


    <!-- ===================================================
         FORMULARIO
         =================================================== -->

    <form
      (ngSubmit)="login()"
      novalidate
    >


      <!-- =================================================
           CORREO
           ================================================= -->

      <div class="form-group">

        <label for="login-email">
          Correo electrónico
        </label>


        <input
          id="login-email"
          type="email"
          name="email"
          [(ngModel)]="email"
          placeholder="Ingrese su correo"
          autocomplete="email"
          [disabled]="loading()"
          (input)="limpiarError()"
          required
        />

      </div>


      <!-- =================================================
           CONTRASEÑA
           ================================================= -->

      <div class="form-group">

        <label for="login-password">
          Contraseña
        </label>


        <input
          id="login-password"
          type="password"
          name="password"
          [(ngModel)]="password"
          placeholder="Ingrese su contraseña"
          autocomplete="current-password"
          [disabled]="loading()"
          (input)="limpiarError()"
          required
        />

      </div>


      <!-- =================================================
           ERROR
           ================================================= -->

      @if (
        errorMessage()
      ) {

        <div
          class="error-message"
          role="alert"
          aria-live="assertive"
        >

          <span
            class="error-icon"
            aria-hidden="true"
          >
            !
          </span>


          <span>
            {{ errorMessage() }}
          </span>

        </div>

      }


      <!-- =================================================
           BOTÓN
           ================================================= -->

      <button
        type="submit"
        [disabled]="loading()"
      >

        @if (
          loading()
        ) {

          <span
            class="button-spinner"
            aria-hidden="true"
          >
          </span>

          <span>
            Ingresando...
          </span>

        } @else {

          <span>
            Ingresar
          </span>

        }

      </button>

    </form>

  </div>

</section>
