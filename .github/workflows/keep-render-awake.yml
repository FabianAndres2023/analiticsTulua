name: Mantener Render Activo

on:
  schedule:
    # Ejecutar cada 10 minutos
    - cron: "*/10 * * * *"

  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest

    steps:
      - name: Hacer ping a Render
        run: |
          curl -L --silent --show-error --fail \
          "${{ secrets.RENDER_URL }}"